<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="mcp-nexus — unified MCP search gateway for Tavily and Brave with key-pool rotation, client auth, and usage observability" />
    <meta name="color-scheme" content="light dark" />
    <title>mcp-nexus — multi-provider MCP search gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Verdigris type system: IBM Plex Sans (UI/body) + IBM Plex Mono (data) -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Verdigris is light-first; honor an explicit stored override.
      (function() {
        const stored = localStorage.getItem('theme');
        const theme = stored === 'light' || stored === 'dark' ? stored : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
