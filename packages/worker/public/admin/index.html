<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>mcp-nexus · admin console</title>
    <!-- Geist fonts are self-hosted via @fontsource (see main.tsx imports).
         No external font requests — avoids render-blocking and privacy leaks. -->
    <script>
      // Apply the stored theme before paint to avoid a flash. Default: light.
      (function () {
        try {
          var raw = localStorage.getItem('mcp-nexus.adminUiPrefs.v2');
          var theme = 'light';
          if (raw) {
            var t = JSON.parse(raw).theme;
            if (t === 'light' || t === 'dark') theme = t;
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" crossorigin src="/admin/assets/index-CxB5KAoD.js"></script>
    <link rel="stylesheet" crossorigin href="/admin/assets/index-C3mHK1y1.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
